<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>PRIME CINEMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --background: #111214;
            --surface: #1b1c1f;
            --surface-raised: #232529;
            --border: rgba(255, 255, 255, 0.09);
            --accent: #c9b894;
            --text: #f1f1ef;
            --muted: #a2a3a6;
            --tab-height: 72px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            margin: 0;
            padding: 0 0 calc(var(--tab-height) + env(safe-area-inset-bottom) + 22px);
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body.has-selection {
            padding-bottom: calc(var(--tab-height) + 82px + env(safe-area-inset-bottom));
        }

        button {
            color: inherit;
            font: inherit;
        }

        .page-shell {
            width: min(100%, 620px);
            margin: 0 auto;
            padding: 20px 16px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .brand-name {
            margin: 0;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        .intro {
            margin: 0 0 22px;
        }

        .intro h2,
        .profile-heading {
            margin: 0;
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .intro-copy {
            margin: 11px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .tab-content[hidden],
        .series-detail[hidden] {
            display: none;
        }

        .catalog-grid {
            display: grid;
            gap: 18px;
        }

        .series-card {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1.18;
            overflow: hidden;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(135deg, #2b2d31, #17181b 68%, #242529);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
            cursor: pointer;
            text-align: left;
            transition: border-color 180ms ease, transform 180ms ease;
        }

        .series-card:active {
            transform: scale(0.99);
        }

        .series-card:focus-visible,
        .episode-option:focus-visible,
        .action-button:focus-visible,
        .back-button:focus-visible,
        .tab-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .series-card:hover {
            border-color: rgba(255, 255, 255, 0.24);
        }

        .card-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        .series-card::after {
            position: absolute;
            inset: 35% 0 0;
            background: linear-gradient(180deg, transparent, rgba(10, 11, 12, 0.9));
            content: "";
            pointer-events: none;
        }

        .card-content {
            position: absolute;
            z-index: 1;
            right: 18px;
            bottom: 17px;
            left: 18px;
        }

        .card-label {
            display: inline-flex;
            margin-bottom: 7px;
            color: rgba(255, 255, 255, 0.76);
            font-size: 11px;
            font-weight: 500;
        }

        .card-title {
            display: block;
            font-size: 25px;
            font-weight: 650;
            line-height: 1.15;
        }

        .card-meta {
            display: block;
            margin-top: 8px;
            color: rgba(245, 241, 232, 0.74);
            font-size: 13px;
        }

        .series-detail {
            animation: reveal 220ms ease both;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 16px;
            padding: 8px 0;
            border: 0;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
        }

        .detail-poster {
            position: relative;
            aspect-ratio: 1.18;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(135deg, #2b2d31, #17181b 68%, #242529);
        }

        .detail-poster-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        .detail-poster::after {
            position: absolute;
            inset: 45% 0 0;
            background: linear-gradient(180deg, transparent, rgba(10, 11, 12, 0.88));
            content: "";
            pointer-events: none;
        }

        .detail-poster-copy {
            position: absolute;
            z-index: 1;
            right: 18px;
            bottom: 16px;
            left: 18px;
        }

        .detail-title {
            margin: 0;
            font-size: 27px;
            font-weight: 650;
        }

        .detail-meta {
            margin: 7px 0 0;
            color: rgba(245, 241, 232, 0.75);
            font-size: 13px;
        }

        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin: 24px 0 12px;
        }

        .section-heading h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .section-heading span {
            color: var(--muted);
            font-size: 12px;
        }

        .episode-list {
            display: grid;
            gap: 8px;
        }

        .episode-option {
            display: flex;
            width: 100%;
            min-height: 58px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 14px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            background: var(--surface);
            cursor: pointer;
            text-align: left;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .episode-option:hover,
        .episode-option.selected {
            border-color: rgba(201, 184, 148, 0.55);
            background: var(--surface-raised);
        }

        .episode-name {
            font-size: 14px;
            font-weight: 600;
        }

        .episode-description {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }

        .episode-price {
            flex: 0 0 auto;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
        }

        .action-button {
            width: 100%;
            min-height: 52px;
            margin-top: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            background: #e7e5df;
            color: #17181a;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.02em;
            transition: filter 160ms ease, transform 160ms ease;
        }

        .action-button:hover {
            filter: brightness(1.08);
        }

        .action-button:active {
            transform: scale(0.99);
        }

        .selection-bar {
            position: fixed;
            z-index: 6;
            right: 0;
            bottom: calc(var(--tab-height) + env(safe-area-inset-bottom));
            left: 0;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            background: rgba(25, 26, 29, 0.97);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .selection-bar.visible {
            display: flex;
        }

        .selection-summary {
            display: flex;
            min-width: 0;
            flex: 1;
            flex-direction: column;
            gap: 4px;
        }

        .selection-name {
            overflow: hidden;
            font-size: 12px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .selection-price {
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
        }

        .selection-bar .action-button {
            width: auto;
            min-height: 46px;
            flex: 0 0 auto;
            margin: 0;
            padding: 0 16px;
        }

        .profile-card {
            padding: 21px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
        }

        .profile-heading {
            font-size: 28px;
        }

        .profile-field {
            margin-top: 22px;
        }

        .profile-label {
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .profile-value {
            overflow-wrap: anywhere;
            font-size: 15px;
            font-weight: 600;
        }

        .profile-note {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .tab-bar {
            position: fixed;
            z-index: 5;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            height: calc(var(--tab-height) + env(safe-area-inset-bottom));
            justify-content: center;
            gap: 38px;
            padding: 9px 16px calc(9px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(17, 18, 20, 0.96);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .tab-button {
            display: flex;
            min-width: 82px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
        }

        .tab-button.active {
            color: var(--accent);
        }

        .tab-icon {
            font-size: 17px;
            line-height: 1;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 520px) {
            .page-shell {
                padding-top: 30px;
            }

            .catalog-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <header class="brand">
            <h1 class="brand-name">PRIME CINEMA</h1>
        </header>

        <section id="tab-catalog" class="tab-content">
            <div id="catalog-view">
                <div class="intro">
                    <h2>Каталог сериалов</h2>
                </div>
                <div id="catalog-grid" class="catalog-grid"></div>
            </div>
            <section id="series-detail" class="series-detail" hidden aria-live="polite"></section>
        </section>

        <section id="tab-profile" class="tab-content" hidden>
            <div class="intro">
                <h2>Профиль</h2>
                <p class="intro-copy">Данные Telegram-аккаунта, с которого открыт каталог.</p>
            </div>
            <div class="profile-card">
                <h3 class="profile-heading">Личные данные</h3>
                <div class="profile-field">
                    <div class="profile-label">Имя пользователя</div>
                    <div class="profile-value" id="user-name">Не удалось определить</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Telegram ID</div>
                    <div class="profile-value" id="user-id">Недоступен</div>
                </div>
                <p class="profile-note">Для вопросов по заказу или доступу напишите администратору.</p>
            </div>
        </section>
    </main>

    <nav class="tab-bar" aria-label="Основная навигация">
        <button class="tab-button active" type="button" data-tab="catalog" aria-current="page">
            <span class="tab-icon" aria-hidden="true">⌂</span>
            <span>Каталог</span>
        </button>
        <button class="tab-button" type="button" data-tab="profile">
            <span class="tab-icon" aria-hidden="true">◉</span>
            <span>Профиль</span>
        </button>
    </nav>

    <div id="selection-bar" class="selection-bar" aria-hidden="true">
        <div class="selection-summary">
            <span id="selection-name" class="selection-name"></span>
            <span id="selection-price" class="selection-price"></span>
        </div>
        <button class="action-button" type="button" data-order>Связаться</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        const adminUrl = 'https://t.me/scugi';
        const products = [
            {
                id: 'aida',
                title: 'Айда',
                poster: '2.jpg',
                episodes: 8,
                description: 'Полный сезон и отдельные серии доступны для заказа.'
            },
            {
                id: 'heavy-lux',
                title: 'Тяжелый люкс',
                poster: '1.jpg',
                episodes: 8,
                description: 'Полный сезон и отдельные серии доступны для заказа.'
            }
        ];

        let selectedProduct = null;
        let currentSeries = null;
        const selectionBar = document.getElementById('selection-bar');

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const telegramUser = tg?.initDataUnsafe?.user;
        if (telegramUser) {
            const fullName = [telegramUser.first_name, telegramUser.last_name]
                .filter(Boolean)
                .join(' ');
            document.getElementById('user-name').textContent =
                fullName + (telegramUser.username ? ` (@${telegramUser.username})` : '');
            document.getElementById('user-id').textContent = String(telegramUser.id);
        }

        function renderCatalog() {
            const catalogGrid = document.getElementById('catalog-grid');
            catalogGrid.innerHTML = products.map((product) => `
                <button class="series-card" type="button" data-series="${product.id}">
                    <img class="card-poster" src="${product.poster}" alt="" loading="lazy">
                    <span class="card-content">
                        <span class="card-label">${product.episodes} серий</span>
                        <span class="card-title">${product.title}</span>
                        <span class="card-meta">Открыть сериал&nbsp; →</span>
                    </span>
                </button>
            `).join('');
            hideUnavailablePosters(catalogGrid);
        }

        function hideUnavailablePosters(container) {
            container.querySelectorAll('img').forEach((image) => {
                image.addEventListener('error', () => {
                    image.hidden = true;
                }, { once: true });
            });
        }

        function openSeries(seriesId) {
            const product = products.find((item) => item.id === seriesId);
            if (!product) {
                return;
            }

            currentSeries = product;
            selectedProduct = null;
            syncSelectionBar();
            document.getElementById('catalog-view').hidden = true;
            const detail = document.getElementById('series-detail');
            detail.hidden = false;
            detail.innerHTML = `
                <button class="back-button" type="button" data-back>
                    <span aria-hidden="true">←</span> Все сериалы
                </button>
                <div class="detail-poster">
                    <img class="detail-poster-image" src="${product.poster}" alt="Постер сериала «${product.title}»">
                    <div class="detail-poster-copy">
                        <h2 class="detail-title">${product.title}</h2>
                        <p class="detail-meta">1 сезон · ${product.episodes} серий</p>
                    </div>
                </div>
                <p class="intro-copy">${product.description}</p>
                <div class="section-heading">
                    <h3>Выберите доступ</h3>
                    <span>Оплата через администратора</span>
                </div>
                <div class="episode-list">
                    <button class="episode-option" type="button" data-kind="season">
                        <span>
                            <span class="episode-name">Весь 1 сезон</span>
                            <span class="episode-description">Доступ ко всем сериям</span>
                        </span>
                        <span class="episode-price">399 ₽</span>
                    </button>
                    ${Array.from({ length: product.episodes }, (_, index) => `
                        <button class="episode-option" type="button" data-kind="episode" data-episode="${index + 1}">
                            <span>
                                <span class="episode-name">Серия ${index + 1}</span>
                                <span class="episode-description">Отдельный доступ</span>
                            </span>
                            <span class="episode-price">59 ₽</span>
                        </button>
                    `).join('')}
                </div>
            `;
            hideUnavailablePosters(detail);
        }

        function syncSelectionBar() {
            const shouldShow = Boolean(
                selectedProduct &&
                currentSeries &&
                !document.getElementById('tab-catalog').hidden
            );
            selectionBar.classList.toggle('visible', shouldShow);
            selectionBar.setAttribute('aria-hidden', String(!shouldShow));
            document.body.classList.toggle('has-selection', shouldShow);

            if (selectedProduct) {
                document.getElementById('selection-name').textContent = selectedProduct.name;
                document.getElementById('selection-price').textContent = selectedProduct.price;
            }
        }

        function showTab(tabName) {
            document.getElementById('tab-catalog').hidden = tabName !== 'catalog';
            document.getElementById('tab-profile').hidden = tabName !== 'profile';
            document.querySelectorAll('.tab-button').forEach((button) => {
                const isActive = button.dataset.tab === tabName;
                button.classList.toggle('active', isActive);
                if (isActive) {
                    button.setAttribute('aria-current', 'page');
                } else {
                    button.removeAttribute('aria-current');
                }
            });
            syncSelectionBar();
        }

        function returnToCatalog() {
            currentSeries = null;
            selectedProduct = null;
            document.getElementById('series-detail').hidden = true;
            document.getElementById('catalog-view').hidden = false;
            syncSelectionBar();
        }

        function contactAdmin() {
            if (!selectedProduct) {
                const message = 'Сначала выберите сезон или серию.';
                if (tg) {
                    tg.showAlert(message);
                } else {
                    window.alert(message);
                }
                return;
            }

            const text = `Здравствуйте! Хочу приобрести ${selectedProduct.name} за ${selectedProduct.price}.`;
            const contactUrl = `${adminUrl}?text=${encodeURIComponent(text)}`;
            const prompt = `Вы выбрали: ${selectedProduct.name} — ${selectedProduct.price}.\nДля оформления заказа перейдите в чат с администратором.`;

            if (tg?.showPopup) {
                tg.showPopup({
                    title: 'Оформление заказа',
                    message: prompt,
                    buttons: [
                        { id: 'contact', type: 'default', text: 'Перейти к администратору' },
                        { type: 'cancel', text: 'Отмена' }
                    ]
                }, (buttonId) => {
                    if (buttonId === 'contact') {
                        tg.openTelegramLink(contactUrl);
                    }
                });
            } else if (window.confirm(`${prompt}\n\nОткрыть чат с администратором?`)) {
                window.open(contactUrl, '_blank', 'noopener');
            }
        }

        document.querySelector('.tab-bar').addEventListener('click', (event) => {
            const button = event.target.closest('[data-tab]');
            if (button) {
                showTab(button.dataset.tab);
            }
        });

        document.getElementById('catalog-grid').addEventListener('click', (event) => {
            const card = event.target.closest('[data-series]');
            if (card) {
                openSeries(card.dataset.series);
            }
        });

        document.getElementById('series-detail').addEventListener('click', (event) => {
            const backButton = event.target.closest('[data-back]');
            if (backButton) {
                returnToCatalog();
                return;
            }

            const option = event.target.closest('[data-kind]');
            if (option) {
                document.querySelectorAll('.episode-option').forEach((item) => {
                    item.classList.toggle('selected', item === option);
                    item.setAttribute('aria-pressed', String(item === option));
                });
                const isSeason = option.dataset.kind === 'season';
                const name = isSeason
                    ? `${currentSeries.title} — весь 1 сезон`
                    : `${currentSeries.title} — серия ${option.dataset.episode}`;
                const price = isSeason ? '399 ₽' : '59 ₽';
                selectedProduct = { name, price };
                syncSelectionBar();
                return;
            }
        });

        selectionBar.addEventListener('click', (event) => {
            if (event.target.closest('[data-order]')) {
                contactAdmin();
            }
        });

        renderCatalog();
    </script>
</body>
</html>
